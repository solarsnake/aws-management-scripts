name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install bats and shellcheck (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y bats shellcheck

      - name: Install bats and shellcheck (macOS)
        if: runner.os == 'macOS'
        run: brew install bats-core shellcheck

      - name: shellcheck
        run: shellcheck -x lib/*.sh */*.sh test/bin/aws

      - name: Tests
        run: bats test

      - name: Tests under bash 3.2
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/b32" && ln -sf /bin/bash "$RUNNER_TEMP/b32/bash" && PATH="$RUNNER_TEMP/b32:$PATH" bats test
